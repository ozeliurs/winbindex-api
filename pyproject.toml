[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winbindex-api"
version = "0.1.0"
description = "A small, polite cache and API for Winbindex metadata"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
winbindex-scrape = "winbindex_api.scraper:main"

[tool.setuptools.packages.find]
include = ["winbindex_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
